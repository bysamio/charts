apiVersion: v2
name: wordpress
description: A Helm chart for WordPress using SamSoft non-root Docker image (runs as UID 1001 on port 8080)
type: application
version: 3.0.1
appVersion: "7.1.3"
keywords:
  - wordpress
  - cms
  - blog
home: https://wordpress.org/
icon: https://s.w.org/style/images/about/WordPress-logotype-wmark.png
sources:
- https://github.com/sammyeby/charts
- https://github.com/WordPress/WordPress
maintainers:
- name: SamSoft Technologies
  url: https://github.com/sammyeby
dependencies:
  - name: mariadb
    version: "1.0.2"
    repository: oci://ghcr.io/sammyeby/charts
    condition: mariadb.enabled
  - name: memcached
    version: "1.0.1"
    repository: oci://ghcr.io/sammyeby/charts
    condition: memcached.enabled
