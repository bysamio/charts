# CasePack Umbrella Helm Chart — Default Values
# Deploys the full CasePack stack: API, SPA, PostgreSQL, Keycloak, Gotenberg, SeaweedFS
#
# Override per-subchart using the subchart key prefix:
#   casepack-api.config.corsOrigins: "https://casepack.example.com"
#   postgresql.auth.password: "changeme"
#
# For production, disable bundled infra and point to external services:
#   postgresql.enabled: false
#   keycloak.enabled: false
#   gotenberg.enabled: false
#   seaweedfs.enabled: false

# ─── Global ──────────────────────────────────────────────────────
global:
  # Domain base — used to derive defaults for subcharts
  domain: "casepack.example.com"
  # StorageClass for all PVCs (leave empty to use cluster default)
  storageClass: ""

# ═══════════════════════════════════════════════════════════════
#  CasePack API
# ═══════════════════════════════════════════════════════════════
casepack-api:
  replicaCount: 1

  image:
    repository: ghcr.io/bysamio/casepack-api
    tag: ""
    pullPolicy: IfNotPresent

  config:
    serverPort: "8080"
    forwardHeadersStrategy: "NATIVE"
    oidcIssuerUri: "http://casepack-keycloak/realms/casepack"
    oidcJwkSetUri: ""
    s3Endpoint: "http://casepack-seaweedfs-s3:8333"
    # Optional browser-facing endpoint used for presigned upload/download URLs.
    # When blank, the API signs URLs with s3Endpoint.
    # For Kubernetes installs that use existingSecret, also include
    # S3_PUBLIC_ENDPOINT in that Secret.
    s3PublicEndpoint: ""
    gotenbergUrl: "http://casepack-gotenberg:3000"
    s3Region: "us-east-1"
    s3Bucket: "casepack"
    s3PathStyle: "true"
    s3PresignExpiry: "900"
    s3AutoCreateBucket: "true"
    s3BucketPerTenant: "false"
    evidenceMaxBytes: "104857600"
    evidenceAllowedTypes: ""
    rateLimitEnabled: "true"
    rateLimitInit: "30"
    rateLimitFinalize: "30"
    rateLimitGlobal: "300"
    rateLimitWebhookIntake: "60"
    exportMaxItems: "100"
    exportMaxBytes: "536870912"
    exportPoolSize: "2"
    webhookEnabled: "true"
    webhookMaxPayload: "1048576"
    timelineEnabled: "true"
    corsOrigins: "http://localhost:3000"
    deploymentMode: "self_host"
    installationId: ""
    licenseKeySource: "jwks"
    licenseJwksUrl: "https://licensing.bysam.io/.well-known/jwks.json"
    licensingBaseUrl: "https://licensing.bysam.io"
    activationFile: "/run/secrets/activation.json"
    selfHostBootstrapEnabled: "true"
    selfHostBootstrapTenantName: "CasePack Workspace"
    selfHostBootstrapAdminEmail: ""
    selfHostBootstrapAdminInitialPassword: ""
    keycloakBaseUrl: "http://casepack-keycloak"
    keycloakRealm: "casepack"
    keycloakSpaClientId: "casepack-spa"
    keycloakSpaRedirectUri: "http://localhost:3000/auth/callback"
    javaOpts: "-Xms256m -Xmx512m"

  secrets:
    existingSecret: ""
    dbUrl: "jdbc:postgresql://casepack-postgresql-primary:5432/casepack"
    dbUser: "casepack"
    dbPass: "casepack"                 # Override in production!
    s3AccessKey: "admin"
    s3SecretKey: "admin123456"
    # Inline license JWT exposed to the API as CASEPACK_LICENSE_TOKEN.
    licenseToken: ""
    licensePublicKey: ""
    # Helper values for wrapper-owned Kubernetes Secrets. The recommended
    # production path is an existingSecret containing the API runtime env vars.
    licenseTokenFile: ""
    activationBundle: ""
    keycloakSaClientId: "casepack-user-manager"
    keycloakSaClientSecret: "casepack-user-manager-secret"

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: api.casepack.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

  podLabels:
    gotenberg-client: "true"

# ═══════════════════════════════════════════════════════════════
#  CasePack SPA
# ═══════════════════════════════════════════════════════════════
casepack-spa:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/bysamio/casepack-spa
    tag: ""
    pullPolicy: IfNotPresent
  config:
    apiBaseUrl: "http://localhost:8080"
    oidcAuthority: "http://localhost:8081/realms/casepack"
    oidcClientId: "casepack-spa"
    deploymentMode: "SELF_HOST"
    licensingPortalUrl: "https://licensing.bysam.io/portal"
  ingress:
    enabled: false
    className: nginx
    hosts:
      - host: casepack.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ═══════════════════════════════════════════════════════════════
#  PostgreSQL (BySamio)
# ═══════════════════════════════════════════════════════════════
postgresql:
  enabled: true
  auth:
    database: casepack
    username: casepack
    password: casepack             # Override in production!
    postgresPassword: postgres     # Override in production!
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ═══════════════════════════════════════════════════════════════
#  Keycloak (BySamio chart)
# ═══════════════════════════════════════════════════════════════
keycloak:
  enabled: true
  image:
    tag: 26.7.0-optimized
  # The bundled realm is imported before Keycloak becomes ready. Keycloak
  # skips startup imports when the realm already exists.
  extraStartupArgs: |-
    - --import-realm
  production: false
  httpEnabled: true
  auth:
    adminUser: admin
    adminPassword: admin           # Override in production!
  # Use the parent PostgreSQL chart for the bundled stack. The Keycloak
  # subchart also ships a PostgreSQL dependency; keep it disabled here so
  # the umbrella chart has one database service to operate.
  postgresql:
    enabled: false
  externalDatabase:
    host: casepack-postgresql-primary
    port: 5432
    database: keycloak
    user: keycloak
    password: keycloak             # Override in production!
  # The bootstrap realm's service-account client secret is never stored in
  # its ConfigMap. When set, this Secret must contain
  # CASEPACK_KEYCLOAK_SA_CLIENT_SECRET and should be the same Secret used by
  # casepack-api.secrets.existingSecret.
  bootstrapRealm:
    existingSecret: ""
  # SMTP is used by Keycloak for invitations, password setup, and password
  # resets. Prefer existingSecret in production. The Secret must contain all
  # nine KC_SMTP_* keys documented in this chart's README.
  smtp:
    existingSecret: ""
    host: ""
    port: "587"
    from: noreply@localhost
    fromDisplayName: CasePack
    auth: "true"
    user: ""
    password: ""
    starttls: "true"
    ssl: "false"
  theme:
    image:
      repository: ghcr.io/bysamio/keycloak-themes
      tag: 0.5.0
      pullPolicy: IfNotPresent
  extraEnvVars:
    - name: CASEPACK_KEYCLOAK_SA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.bootstrapRealm.existingSecret }}{{ .Values.bootstrapRealm.existingSecret }}{{ else }}{{ include "casepack.keycloakBootstrapSecretName" . }}{{ end }}'
          key: CASEPACK_KEYCLOAK_SA_CLIENT_SECRET
    - name: KC_SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_HOST
    - name: KC_SMTP_PORT
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_PORT
    - name: KC_SMTP_FROM
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_FROM
    - name: KC_SMTP_FROM_DISPLAY_NAME
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_FROM_DISPLAY_NAME
    - name: KC_SMTP_AUTH
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_AUTH
    - name: KC_SMTP_USER
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_USER
    - name: KC_SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_PASSWORD
    - name: KC_SMTP_STARTTLS
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_STARTTLS
    - name: KC_SMTP_SSL
      valueFrom:
        secretKeyRef:
          name: '{{ if .Values.smtp.existingSecret }}{{ .Values.smtp.existingSecret }}{{ else }}{{ include "casepack.keycloakSmtpSecretName" . }}{{ end }}'
          key: KC_SMTP_SSL
  initContainers:
    - name: theme-loader
      image: '{{ printf "%s:%s" .Values.theme.image.repository .Values.theme.image.tag }}'
      imagePullPolicy: '{{ .Values.theme.image.pullPolicy }}'
      command: ["sh", "-c", "cp -r /themes/casepack /target/"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: themes
          mountPath: /target
  extraVolumes:
    - name: themes
      emptyDir: {}
    - name: casepack-realm
      configMap:
        name: '{{ include "casepack.keycloakRealmConfigMapName" . }}'
  extraVolumeMounts:
    - name: themes
      mountPath: /opt/keycloak/themes
      readOnly: true
    - name: casepack-realm
      mountPath: /opt/keycloak/data/import
      readOnly: true
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi
  ingress:
    enabled: false
    className: nginx
    hosts:
      - host: auth.casepack.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ═══════════════════════════════════════════════════════════════
#  Gotenberg (internal PDF rendering)
# ═══════════════════════════════════════════════════════════════
gotenberg:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  networkPolicy:
    enabled: true
    allowExternal: false
    clientLabels:
      gotenberg-client: "true"
    allowExternalEgress: false
  env:
    API_TIMEOUT: "60s"
    API_BODY_LIMIT: "50MB"
    API_DISABLE_DOWNLOAD_FROM: "true"
    API_ENABLE_DEBUG_ROUTE: "false"
    CHROMIUM_MAX_CONCURRENCY: "2"
    CHROMIUM_MAX_QUEUE_SIZE: "20"
    CHROMIUM_CLEAR_CACHE: "true"
    CHROMIUM_CLEAR_COOKIES: "true"
    WEBHOOK_DISABLE: "true"

# ═══════════════════════════════════════════════════════════════
#  SeaweedFS (S3-compatible storage)
# ═══════════════════════════════════════════════════════════════
seaweedfs:
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: latest
  s3:
    enabled: true
    port: 8333
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
