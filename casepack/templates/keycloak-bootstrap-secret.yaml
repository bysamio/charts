{{- if and .Values.keycloak.enabled (not .Values.keycloak.bootstrapRealm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "casepack.keycloakBootstrapSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casepack.labels" . | nindent 4 }}
type: Opaque
stringData:
  CASEPACK_KEYCLOAK_SA_CLIENT_SECRET: {{ index .Values "casepack-api" "secrets" "keycloakSaClientSecret" | quote }}
{{- end }}
